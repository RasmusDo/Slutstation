# ============================================================================
# Nightly database backup, held OUTSIDE Supabase.
#
# Supabase keeps its own daily backups, and they are good — right up until the
# day the problem is the Supabase account itself (billing lapse, compromised
# login, fat-fingered project delete). This dump lands in GitHub's artifact
# storage under this private repo, which is a different account, a different
# password, and a different failure domain.
#
# Setup (one time):
#   1. Repo -> Settings -> Secrets and variables -> Actions -> New secret
#      Name:  SUPABASE_DB_URL
#      Value: the "Connection string" (URI, Session pooler) from
#             Supabase -> Project Settings -> Database, password filled in.
#   2. Nothing else. First run can be fired by hand from the Actions tab
#      (workflow_dispatch) to prove it works.
#
# Restore: download the artifact, then
#   pg_restore --clean --if-exists -d "$NEW_DB_URL" backup.dump
# ============================================================================
name: Database backup

on:
  schedule:
    - cron: "20 3 * * *"   # 03:20 UTC nightly; off the hour like every job here
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      # The client must be at least as new as the server. Supabase projects
      # run Postgres 15 or 17 depending on age; the pgdg repo's 17 client
      # dumps both.
      - name: Install postgresql-client 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret is not set — see the header of this file." >&2
            exit 1
          fi
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges --format=custom \
            --file=backup.dump
          ls -lh backup.dump

      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 14
